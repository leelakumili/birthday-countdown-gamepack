<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Birthday Adventure Game Pack</title>
  <!-- manifest injected via JS to avoid CORS errors on file:// protocol -->
  <meta name="theme-color" content="#ff69b4" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a0a2e;
      color: #fff;
      font-family: 'Nunito', system-ui, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 80px; margin-bottom: 24px; }
    h1 {
      font-size: 2rem;
      color: #ff69b4;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    p {
      font-size: 1.1rem;
      color: #ccc;
      max-width: 340px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      background: #ff69b4;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .note {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="icon">🎮</div>
  <h1>You're Offline</h1>
  <p>Looks like you've lost your connection. The Birthday Adventure needs internet on your first visit to load all the games.</p>
  <a href="./launcher/index.html" class="btn">Try Again</a>
  <p class="note">Once you've visited online, all games work offline automatically!</p>
  <script>
    if (location.protocol === 'https:' || location.protocol === 'http:') {
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = './manifest.json';
      document.head.appendChild(link);
    }
    // Auto-retry when connection is restored
    window.addEventListener('online', function () {
      window.location.replace('./launcher/index.html');
    });
  </script>
</body>
</html>
