<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Adventure Game Pack</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="./manifest.json" />

  <!-- Theme color -->
  <meta name="theme-color" content="#ff69b4" />

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BdayGames" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Android / general icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />

  <!-- Windows tile -->
  <meta name="msapplication-TileColor" content="#1a0a2e" />
  <meta name="msapplication-TileImage" content="./icons/icon-192.png" />

  <!-- Open Graph -->
  <meta property="og:title" content="Birthday Adventure Game Pack" />
  <meta property="og:description" content="A 10-day birthday countdown with daily unlockable mini-games." />
  <meta property="og:image" content="./icons/icon-512.png" />
  <meta property="og:type" content="website" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a0a2e;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .loader { text-align: center; }
    .loader-icon { font-size: 64px; animation: bounce 1s infinite alternate; }
    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-16px); }
    }
    .loader p { margin-top: 16px; color: #ff69b4; font-size: 1.1rem; }
    .loader a { color: #ccc; font-size: 0.9rem; margin-top: 8px; display: block; }
  </style>

  <script>
    // Register service worker at root scope
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .catch(function (err) { console.warn('[SW] Registration failed:', err); });
    }
    // Redirect to launcher
    window.location.replace('./launcher/index.html');
  </script>
</head>
<body>
  <div class="loader">
    <div class="loader-icon">🎂</div>
    <p>Loading Birthday Adventure…</p>
    <a href="./launcher/index.html">Tap here if not redirected</a>
  </div>
</body>
</html>
