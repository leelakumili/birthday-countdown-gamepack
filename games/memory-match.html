<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Game</title>
  <style>
    @import url('../assets/fonts/fonts.css');

    :root {
      --game-max-width: min(92vw, 760px);
      --green-dark: var(--surface, #111827);
      --green-mid: var(--accent-2, #3b82f6);
      --green-light: var(--muted, #9bb8d4);
      --green-pale: var(--surface-2, #1e2d45);
      --yellow: #ffd166;
      --orange: #f4845f;
      --red: #ef233c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg, #0a0e1a);
      min-height: 100vh;
      overflow-x: hidden;
      color: #222;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      background-image: var(--stripe-texture);
      pointer-events: none;
      z-index: 0;
    }

    /* ══════════════════════════════ SCREENS ══════════════════════════════ */
    .screen {
      display: none;
      position: relative;
      z-index: 1;
    }
    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ══════════════════════════════ LAUNCHER TOP BAR ══════════════════════════════ */
    #launcher-bar {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 9px 13px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 20;
      width: 100%;
    }
    .lb-left { display: flex; align-items: center; gap: 8px; }
    .lb-av {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--accent-2, #3b82f6); display: flex; align-items: center;
      justify-content: center; font-size: 11px; font-weight: 800;
      color: #fff; flex-shrink: 0;
    }
    .lb-name { font-size: 15px; font-weight: 700; color: #fff; }
    .lb-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.8);
      font-size: 15px; font-weight: 700;
      padding: 5px 11px; border-radius: 10px;
      cursor: pointer; font-family: 'Nunito', sans-serif;
      white-space: nowrap; transition: background .15s;
    }
    .lb-btn:hover { background: rgba(255, 255, 255, 0.2); }

    /* ══════════════════════════════ LEVEL SELECT ══════════════════════════════ */
    #screen-levels {
      padding: 2rem 1rem;
      gap: 1.2rem;
    }
    .level-header { text-align: center; }
    .level-header h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem; color: #fff;
      text-shadow: 0 3px 8px rgba(0,0,0,.3);
    }
    .level-header p { color: var(--green-light); font-weight: 600; font-size: .95rem; margin-top: 4px; }
    .game-name-tag {
      display: inline-block;
      font-size: .75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 2px;
      color: var(--green-light);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: 3px 14px; margin-bottom: 6px;
    }
    .level-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px; width: 100%; max-width: var(--game-max-width);
    }
    .level-btn {
      aspect-ratio: 1; border-radius: 16px; border: none;
      cursor: pointer; font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      transition: transform .15s, box-shadow .15s;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 2px; position: relative; overflow: hidden;
    }
    .level-btn .lvl-num { font-size: 1.6rem; line-height: 1; }
    .level-btn .lvl-stars { font-size: .7rem; letter-spacing: 1px; min-height: 14px; }
    .level-btn.unlocked {
      background: var(--yellow); color: var(--green-dark);
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }
    .level-btn.unlocked:hover { transform: translateY(-3px); box-shadow: 0 7px 0 rgba(0,0,0,0.2); }
    .level-btn.unlocked:active { transform: translateY(1px); }
    .level-btn.completed {
      background: var(--green-mid); color: #fff;
      box-shadow: 0 4px 0 var(--green-dark);
    }
    .level-btn.completed:hover { transform: translateY(-3px); }
    .level-btn.locked {
      background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.3);
      cursor: not-allowed; box-shadow: none;
    }
    .level-btn.locked .lvl-num { opacity: .4; }
    .lock-icon { font-size: 1.2rem; }
    .level-actions {
      display: flex; gap: 10px; width: 100%;
      max-width: var(--game-max-width); flex-wrap: wrap; justify-content: center;
    }
    .btn-sm {
      padding: 9px 22px; border-radius: 50px; border: none;
      font-family: 'Nunito', sans-serif; font-weight: 700;
      font-size: .9rem; cursor: pointer; transition: background .2s;
    }
    .btn-reset { background: var(--orange); color: #fff; }
    .btn-reset:hover { background: #e06040; }
    .btn-secondary-sm { background: rgba(255,255,255,0.15); color: #fff; }
    .btn-secondary-sm:hover { background: rgba(255,255,255,0.25); }
    .btn-yellow-sm { background: var(--yellow); color: var(--green-dark); }
    .btn-yellow-sm:hover { background: #f0c030; }

    /* ══════════════════════════════ GAME SCREEN ══════════════════════════════ */
    #screen-game {
      padding: 0; background: var(--bg, #1a2e1c);
      align-items: center; justify-content: flex-start; min-height: 100vh;
    }
    #game-hud {
      width: 100%; max-width: var(--game-max-width);
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px 10px 90px;
      background: rgba(0,0,0,0.3);
      border-bottom: 2px solid rgba(255,255,255,0.1);
      position: relative;
    }
    .hud-item { display: flex; flex-direction: column; align-items: center; }
    .hud-label {
      font-size: .7rem; font-weight: 700;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .hud-value { font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: #fff; }
    #hud-back-btn {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.85);
      font-family: 'Nunito', sans-serif; font-weight: 700;
      font-size: .78rem; padding: 5px 10px; border-radius: 10px;
      cursor: pointer; white-space: nowrap; transition: background .15s; z-index: 5;
    }
    #hud-back-btn:hover { background: rgba(255,255,255,0.22); }

    /* Progress & Timer bars */
    .progress-bar-wrap {
      width: 100%; max-width: var(--game-max-width);
      background: rgba(255,255,255,0.15);
      border-radius: 50px; height: 8px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--green-mid);
      border-radius: 50px; transition: width .4s;
    }
    .timer-bar-wrap {
      width: 100%; max-width: var(--game-max-width);
      background: rgba(255,255,255,0.15);
      border-radius: 50px; height: 10px; overflow: hidden;
    }
    .timer-bar-fill { height: 100%; border-radius: 50px; transition: width 1s linear, background 1s; }

    /* Card grid */
    .card-area {
      padding: .75rem 1rem;
      width: 100%; max-width: var(--game-max-width);
    }
    .card-grid { display: grid; gap: 8px; width: 100%; }
    .memory-card {
      aspect-ratio: 1; border-radius: 14px; cursor: pointer;
      position: relative; -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.175,.885,.32,1.275);
      -webkit-user-select: none; user-select: none;
    }
    .memory-card.flipped { transform: rotateY(180deg); }
    .memory-card.matched { cursor: default; }
    .memory-card.matched .card-front { border: 3px solid var(--yellow); box-shadow: 0 0 18px rgba(255,209,102,.5); }
    .card-face {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; border-radius: 12px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .card-back {
      background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
      box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }
    .card-back::after { content: '⚙️'; font-size: 1.4rem; opacity: .5; }
    .card-front {
      background: white; transform: rotateY(180deg);
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
      border: 2px solid #eee;
    }
    .memory-card.shake { animation: cardShake .4s; }
    @keyframes cardShake {
      0%,100% { transform: rotateY(180deg); }
      25% { transform: rotateY(180deg) translateX(-5px); }
      75% { transform: rotateY(180deg) translateX(5px); }
    }

    /* Pattern phase */
    #patternPhase {
      display: none; width: 100%; max-width: var(--game-max-width); padding: 0 1rem;
    }
    .pattern-phase-box {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 1.5rem; text-align: center;
    }
    .pattern-title {
      font-family: 'Fredoka One', cursive; font-size: 1.5rem;
      color: #fff; margin-bottom: .3rem;
    }
    .pattern-subtitle { color: rgba(255,255,255,0.5); font-size: .9rem; margin-bottom: 1rem; }
    .pattern-grid-container { display: flex; justify-content: center; margin: .75rem 0; }
    .pattern-grid { display: grid; gap: 8px; }
    .pattern-cell {
      width: 66px; height: 66px; border-radius: 14px; font-size: 2rem;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.08); border: 3px solid transparent;
      transition: all .3s; cursor: default; -webkit-user-select: none; user-select: none; color: #fff;
    }
    .pattern-cell.highlight {
      background: rgba(255,209,102,0.25); border-color: var(--yellow);
      transform: scale(1.1); box-shadow: 0 0 18px rgba(255,209,102,.5);
    }
    .pattern-cell.clickable { cursor: pointer; }
    .pattern-cell.clickable:hover { transform: scale(1.08); border-color: var(--green-mid); }
    .pattern-cell.wrong {
      background: rgba(239,35,60,0.2); border-color: var(--red);
      animation: shake .4s;
    }
    .pattern-cell.correct { background: rgba(82,183,136,0.2); border-color: var(--green-mid); }
    @keyframes shake { 0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);} }
    .pattern-progress { font-weight: 700; color: var(--green-light); margin-top: 8px; font-size: .95rem; }

    /* ══════════════════════════════ OVERLAY ══════════════════════════════ */
    .overlay {
      display: none; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 100;
      background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center; padding: 1rem;
    }
    .overlay.active { display: flex; }
    .overlay-card {
      background: #fff; border-radius: 24px; padding: 2rem;
      width: 100%; max-width: 420px; text-align: center;
      box-shadow: 0 16px 64px rgba(0,0,0,.35);
      animation: popIn .3s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .overlay-panda { font-size: 3.5rem; margin-bottom: .5rem; }
    .overlay-title {
      font-family: 'Fredoka One', cursive; font-size: 2rem;
      color: var(--green-dark); margin-bottom: .3rem;
    }
    .overlay-sub { font-size: .95rem; color: #666; margin-bottom: 1.2rem; line-height: 1.5; }
    .stars-display { font-size: 2rem; margin-bottom: 1rem; letter-spacing: 4px; }
    .overlay-stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 1.4rem;
    }
    .stat-box { background: var(--green-pale); border-radius: 12px; padding: 10px; }
    .stat-box .s-label { font-size: .72rem; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
    .stat-box .s-val { font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: var(--green-dark); }
    .overlay-btns { display: flex; flex-direction: column; gap: 8px; }
    .btn-next {
      background: var(--yellow); color: var(--green-dark);
      font-family: 'Fredoka One', cursive; font-size: 1.2rem;
      padding: 12px; border-radius: 14px; border: none;
      cursor: pointer; transition: background .2s;
    }
    .btn-next:hover { background: #f0c030; }
    .btn-retry {
      background: var(--green-pale); color: var(--green-dark);
      font-family: 'Nunito', sans-serif; font-weight: 700;
      font-size: .95rem; padding: 10px; border-radius: 14px;
      border: none; cursor: pointer; transition: background .2s;
    }
    .btn-retry:hover { background: var(--green-light); }
    .btn-menu {
      background: #f0f0f0; color: #888;
      font-family: 'Nunito', sans-serif; font-weight: 700;
      font-size: .9rem; padding: 9px; border-radius: 14px;
      border: none; cursor: pointer; transition: background .2s;
    }
    .btn-menu:hover { background: #e0e0e0; }
    .new-record-banner {
      background: var(--green-pale); border: 1.5px solid var(--green-mid);
      border-radius: 12px; padding: 7px 14px; color: var(--green-dark);
      font-weight: 700; font-size: .88rem; margin-bottom: .8rem; display: none;
    }

    /* ══════════════════════════════ CONFIRM DIALOG ══════════════════════════════ */
    .confirm-card {
      background: #fff; border-radius: 20px; padding: 1.8rem;
      width: 100%; max-width: 340px; text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,.3); animation: popIn .25s ease;
    }
    .confirm-title { font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: var(--text); margin-bottom: .6rem; }
    .confirm-text { font-size: .9rem; color: #666; margin-bottom: 1.4rem; line-height: 1.5; }
    .confirm-btns { display: flex; gap: 10px; }
    .btn-confirm-yes {
      flex: 1; padding: 11px; background: var(--red); color: #fff;
      border: none; border-radius: 12px; font-family: 'Nunito', sans-serif;
      font-weight: 700; cursor: pointer; transition: background .2s;
    }
    .btn-confirm-yes:hover { background: #d01c30; }
    .btn-confirm-no {
      flex: 1; padding: 11px; background: #f0f0f0; color: #666;
      border: none; border-radius: 12px; font-family: 'Nunito', sans-serif;
      font-weight: 700; cursor: pointer; transition: background .2s;
    }
    .btn-confirm-no:hover { background: #e0e0e0; }

    /* ══════════════════════════════ TOAST ══════════════════════════════ */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #fff;
      padding: 10px 24px; border-radius: 50px;
      font-weight: 700; font-size: .9rem; z-index: 999;
      opacity: 0; transition: opacity .3s; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ══════════════════════════════ LEADERBOARD SCREEN ══════════════════════════════ */
    #screen-leaderboard { padding: 1rem; }
    .lb-screen-box {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 1.5rem;
      max-width: var(--game-max-width); width: 100%;
      position: relative; z-index: 1; margin: 0 auto;
    }
    .lb-screen-title {
      font-family: 'Fredoka One', cursive; font-size: 1.8rem;
      color: #fff; text-align: center; margin-bottom: 1rem;
    }
    .lb-tabs {
      display: flex; gap: 6px; margin-bottom: 1rem;
      background: rgba(0,0,0,0.2); border-radius: 50px; padding: 4px;
    }
    .lb-tab {
      flex: 1; padding: 7px; border-radius: 50px; border: none;
      background: transparent; font-family: 'Nunito', sans-serif;
      font-weight: 700; font-size: .85rem; cursor: pointer;
      transition: all .2s; color: rgba(255,255,255,0.45);
    }
    .lb-tab.active { background: rgba(255,255,255,0.15); color: #fff; }
    .lb-table { width: 100%; border-collapse: collapse; }
    .lb-table th {
      font-size: .72rem; font-weight: 700; color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: .5px;
      padding: 6px 8px; text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .lb-table td { padding: 10px 8px; font-size: .9rem; font-weight: 600; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .lb-rank { font-family: 'Fredoka One', cursive; font-size: 1.1rem; color: rgba(255,255,255,0.5); }
    .lb-rank.gold { color: #FFA000; } .lb-rank.silver { color: #9e9e9e; } .lb-rank.bronze { color: #a1673b; }
    .lb-row-me td { color: var(--yellow) !important; }
    .lb-empty { text-align: center; padding: 2rem; color: rgba(255,255,255,0.35); font-size: .95rem; }

    /* Confetti */
    .confetti-piece {
      position: fixed; width: 10px; height: 10px; top: -20px;
      border-radius: 2px; animation: confettiFall linear forwards;
      pointer-events: none; z-index: 9999;
    }
    @keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

    @media (max-width: 480px) {
      .pattern-cell { width: 54px; height: 54px; font-size: 1.6rem; }
      #game-hud { padding: 10px 10px 10px 80px; }
    }
  </style>
  <!-- ── THEME SYSTEM ── -->
  <script src="../config/app-config.js"></script>
  <script src="../engine/panda-adventure.js"></script>
  <script src="../engine/theme-manager.js"></script>
  <script>
    (function () {
      var cfg = window.APP_CONFIG || null;
      if (window.PandaAdventure && window.PandaAdventure.Theme) {
        window.__activeTheme = window.PandaAdventure.Theme.applyFromConfig(cfg);
      }
    })();
  </script>
  <script>
  /* ── THEME SHORTCUTS ── all game scripts below use these globals:
     window.__T  = activeTheme object
     window.__TI = icons   { player, collect, enemy, life, hole }
     window.__TC = canvas  { bgFill, collectFill, enemyFill, ... }
     window.__TS = strings { retryBtn, winBtn, resultsBtn, clueTemplate, ... }
  */
  (function(){
    var t = window.__activeTheme || {};
    window.__T  = t;
    window.__TI = t.icons   || {};
    window.__TC = t.canvas  || {};
    window.__TS = t.strings || {};
  })();
  </script>
</head>
<body>

  <!-- ══════════════════════════════ LAUNCHER BAR ══════════════════════════════ -->
  <div id="launcher-bar">
    <div class="lb-left">
      <div class="lb-av" id="lb-av">?</div>
      <div class="lb-name" id="lb-name"></div>
    </div>
    <button class="lb-btn" onclick="goToLauncher()">🏠 Launcher</button>
  </div>

  <!-- ══════════════════════════════ LEVEL SELECT ══════════════════════════════ -->
  <div id="screen-levels" class="screen">
    <div class="level-header">
      <div class="game-name-tag" id="level-game-tag">Loading...</div>
      <h2 id="levels-greeting">Choose a Level</h2>
      <p>Complete each level to unlock the next!</p>
    </div>
    <div class="level-grid" id="level-grid"></div>
    <div class="level-actions">
      <button class="btn-sm btn-secondary-sm" onclick="showScreen('screen-leaderboard')">🏆 Scores</button>
      <button class="btn-sm btn-reset" onclick="openConfirm('Reset Progress?','All your levels and stars will be reset to zero. This cannot be undone.',confirmReset)">🔄 Reset</button>
    </div>
  </div>

  <!-- ══════════════════════════════ GAME SCREEN ══════════════════════════════ -->
  <div id="screen-game" class="screen">
    <div id="game-hud">
      <button id="hud-back-btn" onclick="confirmQuitToLevels()">← Levels</button>
      <div class="hud-item">
        <span class="hud-label">Level</span>
        <span class="hud-value" id="hud-level">1</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Moves</span>
        <span class="hud-value" id="hud-moves">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Pairs</span>
        <span class="hud-value" id="hud-pairs">0/0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Time</span>
        <span class="hud-value" id="hud-time">0s</span>
      </div>
    </div>
    <div class="progress-bar-wrap" id="progressBarWrap">
      <div class="progress-bar-fill" id="progressBarFill" style="width:0%"></div>
    </div>
    <div class="timer-bar-wrap" id="timerBarWrap" style="display:none">
      <div class="timer-bar-fill" id="timerBarFill" style="background:var(--yellow);width:100%"></div>
    </div>
    <div id="patternPhase"></div>
    <div class="card-area">
      <div class="card-grid" id="cardGrid"></div>
    </div>
  </div>

  <!-- ══════════════════════════════ LEADERBOARD SCREEN ══════════════════════════════ -->
  <div id="screen-leaderboard" class="screen">
    <div class="lb-screen-box">
      <div class="lb-screen-title">🏆 High Scores</div>
      <div class="lb-tabs">
        <button class="lb-tab active" onclick="switchLbTab('total',this)">⭐ Stars</button>
        <button class="lb-tab" onclick="switchLbTab('levels',this)">✅ Levels</button>
        <button class="lb-tab" onclick="switchLbTab('best',this)">🎯 Highest</button>
      </div>
      <div id="lbContent"></div>
      <div style="display:flex;gap:8px;margin-top:1.2rem;flex-wrap:wrap;justify-content:center;">
        <button class="btn-sm btn-secondary-sm" onclick="showScreen('screen-levels')">← Back</button>
        <button class="btn-sm btn-reset" onclick="openConfirm('Clear All Scores?','Every player\'s scores and stars will be wiped. This cannot be undone!',confirmClearScores)">🗑 Clear Scores</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════ OVERLAYS ══════════════════════════════ -->

  <!-- Level Complete -->
  <div id="overlay-levelcomplete" class="overlay">
    <div class="overlay-card">
      <div class="overlay-panda" id="ov-panda">🎮</div>
      <div class="overlay-title" id="ov-title">Level Complete!</div>
      <div class="stars-display" id="ov-stars">⭐⭐⭐</div>
      <div class="overlay-sub" id="ov-sub">Amazing job!</div>
      <div class="new-record-banner" id="ov-newrecord">🎉 New Personal Best!</div>
      <div class="overlay-stats">
        <div class="stat-box"><div class="s-label">Moves</div><div class="s-val" id="ov-moves">0</div></div>
        <div class="stat-box"><div class="s-label">Best</div><div class="s-val" id="ov-best">—</div></div>
      </div>
      <div class="overlay-btns">
        <button class="btn-next" id="ov-btn-next">Next Level →</button>
        <button class="btn-retry" onclick="closeOverlays();replayLevel()">🔄 Play Again</button>
        <button class="btn-menu" onclick="closeOverlays();showScreen('screen-levels')">📋 Level Select</button>
        <button class="btn-menu" onclick="closeOverlays();goToLauncher()">🏠 Back to Launcher</button>
      </div>
    </div>
  </div>

  <!-- Confirm -->
  <div id="overlay-confirm" class="overlay">
    <div class="confirm-card">
      <div class="confirm-title" id="confirm-title">Are you sure?</div>
      <div class="confirm-text" id="confirm-text">This cannot be undone.</div>
      <div class="confirm-btns">
        <button class="btn-confirm-no" onclick="closeOverlays()">Cancel</button>
        <button class="btn-confirm-yes" id="confirm-yes-btn">Yes, do it</button>
      </div>
    </div>
  </div>

  <!-- Birthday -->
  <div id="overlay-birthday" class="overlay">
    <div class="overlay-card" style="max-width:400px;">
      <div id="bday-emoji" style="font-size:4rem;margin-bottom:.5rem;display:block;animation:bob 1.5s ease-in-out infinite;">🎁</div>
      <div style="font-family:'Fredoka One',cursive;font-size:1.6rem;color:var(--green-dark);margin-bottom:.5rem;">Level 10 Complete! 🎉</div>
      <div id="bday-msg" style="font-size:.95rem;color:var(--muted);line-height:1.5;margin-bottom:1rem;"></div>
      <div id="bday-clue-box" id="bday-clue-box" style="background:var(--surface-2);border-radius:14px;padding:1rem 1.2rem;margin-bottom:1.2rem;text-align:left;border:2px solid var(--accent-2);">
        <div style="font-size:.72rem;font-weight:700;color:var(--green-dark);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">🗺️ Your Gift Clue</div>
        <div id="bday-clue-text" style="font-size:.95rem;color:var(--text, #e8f4ff);font-weight:600;line-height:1.5;"></div>
      </div>
      <button id="bday-done-btn" class="btn-next">Mission Report! 🤖</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ═══════════════════════════════ LEVELS CONFIG ═══════════════════════════════
    const LEVELS = [
      // Levels loaded from active theme
      ...((window.__activeTheme && window.__activeTheme.memoryLevels) || [
        { id:1,  name:"Boot Sequence",   emoji:"🤖", type:"memory",  cols:4, rows:3, timeLimit:0,  starMoves:[12,16,20], badge:"🔌 Booting"     },
        { id:2,  name:"Energon Scan",    emoji:"🔋", type:"memory",  cols:4, rows:3, timeLimit:0,  starMoves:[14,18,22], badge:"⚡ Charged"     },
        { id:3,  name:"Signal Lock",     emoji:"📡", type:"pattern", patternLen:4, gridSize:6,     starMoves:[1,2,3],    badge:"📡 Locked"      },
        { id:4,  name:"Autobot Roll",    emoji:"🚗", type:"memory",  cols:4, rows:4, timeLimit:0,  starMoves:[18,22,28], badge:"🚗 Rolling"     },
        { id:5,  name:"Matrix Decode",   emoji:"💎", type:"pattern", patternLen:5, gridSize:9,     starMoves:[1,2,3],    badge:"💎 Decoded"     },
        { id:6,  name:"Cyber Sprint",    emoji:"⚡", type:"speed",   cols:4, rows:3, timeLimit:40, starMoves:[12,15,20], badge:"⚡ Speed Bot"   },
        { id:7,  name:"Twin Primes",     emoji:"🔩", type:"memory",  cols:4, rows:4, timeLimit:0,  starMoves:[16,20,26], badge:"🔩 Engineer"    },
        { id:8,  name:"All Spark",       emoji:"✨", type:"pattern", patternLen:6, gridSize:9,     starMoves:[1,2,3],    badge:"✨ Sparker"     },
        { id:9,  name:"Prime Protocol",  emoji:"🔥", type:"speed",   cols:4, rows:4, timeLimit:55, starMoves:[16,20,26], badge:"🔥 Elite Bot"   },
        { id:10, name:"CYBERTRON BOSS!", emoji:"🏆", type:"memory",  cols:5, rows:4, timeLimit:0,  starMoves:[20,26,32], badge:"🏆 Prime"       }
      ]),
    ];

    // ═══════════════════════════════ DATA ═══════════════════════════════
    const STORAGE_KEY = 'birthday_match_v1';
    const OLD_STORAGE_KEY = 'pandamemory_v1';
    function loadAllData() {
      try {
        let old = localStorage.getItem(OLD_STORAGE_KEY);
        let current = localStorage.getItem(STORAGE_KEY);
        if (old && !current) {
          localStorage.setItem(STORAGE_KEY, old);
          current = old;
        }
        return JSON.parse(current || '{}');
      } catch(e) { return {}; }
    }
    function saveAllData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

    let allData = loadAllData();
    let currentPlayer = null;

    function getPlayerData(name) {
      if (!allData[name]) allData[name] = { unlockedLevels: [1], levelStars: {}, levelBest: {} };
      return allData[name];
    }
    function getTotalStars(n) { return Object.values(getPlayerData(n).levelStars).reduce((a,b) => a+b, 0); }
    function getLevelsDone(n) { return Object.keys(getPlayerData(n).levelStars).length; }
    function getHighestLevel(n) { const c = Object.keys(getPlayerData(n).levelStars).map(Number); return c.length ? Math.max(...c) : 0; }

    // ═══════════════════════════════ GAME STATE ═══════════════════════════════
    let state = {
      currentLevel: null, cards: [], flipped: [], matched: 0,
      moves: 0, timer: 0, timerInterval: null, locked: false,
      pattern: [], playerPattern: [], patternPhase: 'show', totalPairs: 0
    };

    // ═══════════════════════════════ SCREEN NAV ═══════════════════════════════
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if (id === 'screen-levels') buildLevelSelect();
      if (id === 'screen-leaderboard') renderLeaderboard('total');
      updateShell(id);
    }

    // ═══════════════════════════════ LEVEL SELECT ═══════════════════════════════
    function buildLevelSelect() {
      if (!currentPlayer) return;
      const pd = getPlayerData(currentPlayer);
      document.getElementById('levels-greeting').textContent = currentPlayer + "'s Levels";
      const _gt = document.getElementById('level-game-tag');
      if (_gt && typeof gameName !== 'undefined' && gameName) _gt.textContent = gameName;
      const grid = document.getElementById('level-grid');
      grid.innerHTML = '';
      LEVELS.forEach(lvl => {
        const unlocked = pd.unlockedLevels.includes(lvl.id);
        const stars = pd.levelStars[lvl.id] || 0;
        const isCompleted = stars > 0;
        const btn = document.createElement('button');
        btn.className = 'level-btn ' + (isCompleted ? 'completed' : unlocked ? 'unlocked' : 'locked');
        if (unlocked) {
          const starStr = stars > 0 ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : '☆☆☆';
          btn.innerHTML = `<span class="lvl-num">${lvl.id}</span><span class="lvl-stars">${starStr}</span>`;
          btn.onclick = () => startLevel(lvl.id);
        } else {
          btn.innerHTML = `<span class="lvl-num">${lvl.id}</span><span class="lock-icon">${lvl.id === 10 ? '🎂' : '🔒'}</span>`;
        }
        grid.appendChild(btn);
      });
    }

    function confirmReset() {
      if (!currentPlayer) return;
      allData[currentPlayer] = { unlockedLevels: [1], levelStars: {}, levelBest: {} };
      saveAllData(allData);
      buildLevelSelect();
      showToast('Progress reset! Starting fresh 🌱');
    }

    // ═══════════════════════════════ LEADERBOARD ═══════════════════════════════
    function switchLbTab(tab, btn) {
      document.querySelectorAll('.lb-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderLeaderboard(tab);
    }

    function renderLeaderboard(tab) {
      const el = document.getElementById('lbContent');
      const names = Object.keys(allData);
      if (!names.length) { el.innerHTML = '<div class="lb-empty">No players yet!<br>Start playing to see scores 🤖</div>'; return; }
      let rows = names.map(n => ({ name:n, total:getTotalStars(n), levels:getLevelsDone(n), highest:getHighestLevel(n) }));
      if (tab === 'total') rows.sort((a,b) => b.total - a.total);
      else if (tab === 'levels') rows.sort((a,b) => b.levels - a.levels);
      else rows.sort((a,b) => b.highest - a.highest);
      const rk = ['🥇','🥈','🥉'];
      let html = `<table class="lb-table"><thead><tr>
        <th>#</th><th>Player</th>
        <th>${tab==='total'?'⭐ Stars':tab==='levels'?'✅ Levels':'🎯 Highest'}</th>
        <th>⭐</th></tr></thead><tbody>`;
      rows.forEach((r, i) => {
        const isMe = r.name === currentPlayer;
        const rc = i===0?'gold':i===1?'silver':i===2?'bronze':'';
        const val = tab==='total'?r.total:tab==='levels'?r.levels:r.highest||'—';
        html += `<tr class="${isMe?'lb-row-me':''}">
          <td><span class="lb-rank ${rc}">${i < 3 ? rk[i] : i+1}</span></td>
          <td style="font-weight:${isMe?800:600};color:${isMe?'var(--yellow)':'#fff'}">${r.name}${isMe?' 👈':''}</td>
          <td style="font-weight:700">${val}</td>
          <td>${r.total}</td></tr>`;
      });
      el.innerHTML = html + '</tbody></table>';
    }

    function confirmClearScores() {
      allData = {};
      currentPlayer = null;
      saveAllData(allData);
      buildLevelSelect();
      showToast('🗑 All scores cleared!');
    }

    // ═══════════════════════════════ START LEVEL ═══════════════════════════════
    function startLevel(id) {
      if (!currentPlayer) return;
      const lvl = LEVELS.find(l => l.id === id);
      state.currentLevel = lvl;
      state.moves = 0; state.matched = 0; state.flipped = []; state.locked = false;
      clearInterval(state.timerInterval); state.timer = 0;
      showScreen('screen-game');
      document.getElementById('hud-level').textContent = lvl.emoji + ' ' + lvl.id;
      document.getElementById('hud-moves').textContent = '0';
      document.getElementById('hud-time').textContent = '0s';
      document.getElementById('hud-pairs').textContent = '0/0';
      document.getElementById('progressBarFill').style.width = '0%';
      if (lvl.type === 'pattern') {
        document.getElementById('timerBarWrap').style.display = 'none';
        document.getElementById('cardGrid').style.display = 'none';
        document.getElementById('progressBarWrap').style.display = 'none';
        startPatternLevel(lvl);
      } else {
        document.getElementById('patternPhase').style.display = 'none';
        document.getElementById('patternPhase').innerHTML = '';
        document.getElementById('cardGrid').style.display = 'grid';
        document.getElementById('progressBarWrap').style.display = 'block';
        setupMemoryGrid(lvl);
        startTimer(lvl);
      }
    }

    // ═══════════════════════════════ TIMER ═══════════════════════════════
    function startTimer(lvl) {
      clearInterval(state.timerInterval); state.timer = 0;
      if (lvl.type === 'speed' && lvl.timeLimit) {
        document.getElementById('timerBarWrap').style.display = 'block';
        const fill = document.getElementById('timerBarFill');
        let rem = lvl.timeLimit;
        fill.style.width = '100%'; fill.style.background = 'var(--yellow)';
        state.timerInterval = setInterval(() => {
          state.timer++; rem--;
          document.getElementById('hud-time').textContent = rem + 's';
          const p = (rem / lvl.timeLimit) * 100;
          fill.style.width = p + '%';
          if (p < 40) fill.style.background = var_orange;
          if (p < 20) fill.style.background = 'var(--red)';
          if (rem <= 0) {
            clearInterval(state.timerInterval);
            showToast("⏰ Time's up! Try again!");
            setTimeout(() => startLevel(state.currentLevel.id), 1800);
          }
        }, 1000);
      } else {
        document.getElementById('timerBarWrap').style.display = 'none';
        state.timerInterval = setInterval(() => {
          state.timer++;
          document.getElementById('hud-time').textContent = state.timer + 's';
        }, 1000);
      }
    }
    const var_orange = 'var(--orange)';

    // ═══════════════════════════════ MEMORY GRID ═══════════════════════════════
    function setupMemoryGrid(lvl) {
      const grid = document.getElementById('cardGrid');
      const base = (window.__activeTheme && window.__activeTheme.cardEmojis) || ["🤖","🔋","⚡","🚗","💎","📡","🔩","🛸","🌌","✨","🎯","🔐","💻","🛡️","🚀","🌟","⚙️","🔭","🏆","🎖️"];
      const emojis = base.slice(0, (lvl.cols * lvl.rows) / 2);
      let deck = [...emojis, ...emojis].sort(() => Math.random() - .5);
      state.cards = deck;
      state.totalPairs = emojis.length;
      grid.style.gridTemplateColumns = `repeat(${lvl.cols}, 1fr)`;
      grid.innerHTML = '';
      document.getElementById('hud-pairs').textContent = '0/' + state.totalPairs;
      deck.forEach((em, i) => {
        const card = document.createElement('div');
        card.className = 'memory-card';
        card.dataset.emoji = em;
        card.innerHTML = '<div class="card-face card-back"></div><div class="card-face card-front">' + em + '</div>';
        card.addEventListener('click', () => flipCard(card, i));
        grid.appendChild(card);
      });
    }

    function flipCard(card, idx) {
      if (state.locked || card.classList.contains('flipped') || card.classList.contains('matched') || state.flipped.length >= 2) return;
      card.classList.add('flipped');
      state.flipped.push({ card, idx, emoji: state.cards[idx] });
      if (state.flipped.length === 2) {
        state.moves++;
        document.getElementById('hud-moves').textContent = state.moves;
        state.locked = true;
        checkMatch();
      }
    }

    function checkMatch() {
      const [a, b] = state.flipped;
      if (a.emoji === b.emoji) {
        setTimeout(() => {
          a.card.classList.add('matched'); b.card.classList.add('matched');
          state.matched++; state.flipped = []; state.locked = false;
          document.getElementById('hud-pairs').textContent = state.matched + '/' + state.totalPairs;
          document.getElementById('progressBarFill').style.width = (state.matched / state.totalPairs * 100) + '%';
          if (state.matched === state.totalPairs) setTimeout(endLevel, 400);
          else showToast(['✨ Match!','⚡ Nice!','🤖 Yes!','🎯 Locked!'][Math.floor(Math.random()*4)]);
        }, 400);
      } else {
        setTimeout(() => {
          a.card.classList.add('shake'); b.card.classList.add('shake');
          setTimeout(() => {
            a.card.classList.remove('flipped','shake');
            b.card.classList.remove('flipped','shake');
            state.flipped = []; state.locked = false;
          }, 500);
        }, 700);
      }
    }

    // ═══════════════════════════════ PATTERN LEVEL ═══════════════════════════════
    const PATTERN_EMOJIS = (window.__activeTheme && window.__activeTheme.patternEmojis) || ["🤖","🔋","⚡","🚗","💎","📡","🔩","🛸","🌌"];

    function startPatternLevel(lvl) {
      const ph = document.getElementById('patternPhase');
      ph.style.display = 'block';
      ph.innerHTML = '';
      const emojis = PATTERN_EMOJIS.slice(0, lvl.gridSize);
      const pattern = [];
      for (let i = 0; i < lvl.patternLen; i++) pattern.push(Math.floor(Math.random() * lvl.gridSize));
      state.pattern = pattern; state.playerPattern = []; state.patternPhase = 'show'; state.moves = 0;
      const cols = Math.ceil(Math.sqrt(lvl.gridSize));
      ph.innerHTML = `<div class="pattern-phase-box">
        <div class="pattern-title">🧩 Pattern Challenge!</div>
        <div class="pattern-subtitle" id="patternMsg">Watch carefully... 👀</div>
        <div class="pattern-grid-container">
          <div class="pattern-grid" id="patternGrid" style="grid-template-columns:repeat(${cols},1fr)">
            ${emojis.map((e,i) => `<div class="pattern-cell" data-idx="${i}">${e}</div>`).join('')}
          </div>
        </div>
        <div class="pattern-progress" id="patternProgress"></div>
      </div>`;
      showPattern(emojis);
    }

    function showPattern(emojis) {
      const cells = document.querySelectorAll('.pattern-cell');
      const pat = state.pattern;
      let step = 0;
      document.getElementById('patternMsg').textContent = 'Watch the pattern carefully... 👀';
      document.getElementById('patternProgress').textContent = '';
      setTimeout(() => {
        function hl() {
          cells.forEach(c => c.classList.remove('highlight'));
          if (step < pat.length) {
            cells[pat[step]].classList.add('highlight'); step++;
            setTimeout(() => { cells.forEach(c => c.classList.remove('highlight')); setTimeout(hl, 300); }, 700);
          } else {
            setTimeout(() => enablePatternInput(emojis), 500);
          }
        }
        hl();
      }, 800);
    }

    function enablePatternInput(emojis) {
      state.patternPhase = 'input'; state.playerPattern = [];
      document.getElementById('patternMsg').textContent = `Now repeat! (${state.pattern.length} taps)`;
      document.getElementById('patternProgress').textContent = `0 / ${state.pattern.length}`;
      document.querySelectorAll('.pattern-cell').forEach(cell => {
        cell.classList.add('clickable');
        cell.addEventListener('click', () => patternClick(cell, parseInt(cell.dataset.idx), emojis));
      });
    }

    function patternClick(cell, idx, emojis) {
      if (state.patternPhase !== 'input') return;
      const expected = state.pattern[state.playerPattern.length];
      state.playerPattern.push(idx); state.moves++;
      document.getElementById('hud-moves').textContent = state.moves;
      if (idx === expected) {
        cell.classList.add('correct'); setTimeout(() => cell.classList.remove('correct'), 600);
        const prog = state.playerPattern.length;
        document.getElementById('patternProgress').textContent = `${prog} / ${state.pattern.length}`;
        if (prog === state.pattern.length) {
          state.patternPhase = 'done';
          showToast('🎉 Perfect!');
          setTimeout(endLevel, 1200);
        }
      } else {
        cell.classList.add('wrong'); setTimeout(() => cell.classList.remove('wrong'), 600);
        showToast('❌ Watch again...');
        state.patternPhase = 'show'; state.playerPattern = [];
        document.querySelectorAll('.pattern-cell').forEach(c => { c.classList.remove('clickable'); c.replaceWith(c.cloneNode(true)); });
        setTimeout(() => {
          document.querySelectorAll('.pattern-cell').forEach(c => c.classList.remove('correct','wrong','highlight'));
          showPattern(emojis);
        }, 1500);
      }
    }

    // ═══════════════════════════════ END LEVEL ═══════════════════════════════
    function endLevel() {
      clearInterval(state.timerInterval);
      if (!currentPlayer) return;
      const lvl = state.currentLevel;
      const moves = state.moves, time = state.timer;
      const stars = moves <= lvl.starMoves[0] ? 3 : moves <= lvl.starMoves[1] ? 2 : 1;
      const pd = getPlayerData(currentPlayer);
      if ((pd.levelStars[lvl.id] || 0) < stars) pd.levelStars[lvl.id] = stars;
      const prev = pd.levelBest[lvl.id];
      const isNewBest = !prev || moves < prev.moves || (moves === prev.moves && time < prev.time);
      if (isNewBest) pd.levelBest[lvl.id] = { moves, time };
      const nextId = lvl.id + 1;
      if (nextId <= LEVELS.length && !pd.unlockedLevels.includes(nextId)) {
        pd.unlockedLevels.push(nextId);
        showToast('🔓 Level ' + nextId + ' unlocked!');
      }
      saveAllData(allData);
      writeLauncherProgress(stars);

      if (lvl.id === 10 && (birthdayMsg || giftClue)) {
        showBirthdayCelebration(stars, () => showLevelCompleteOverlay(stars, lvl, isNewBest, prev));
      } else {
        setTimeout(() => { showLevelCompleteOverlay(stars, lvl, isNewBest, prev); confetti(); }, 300);
      }
    }

    function showLevelCompleteOverlay(stars, lvl, isNewBest, prev) {
      const msgs = ['','Keep scanning, Autobot! ⚙️','Memory banks are sharp! 🤖','Cybertron-level memory! 🌟'];
      const isLast = lvl.id === 10;
      const _thi = (window.__activeTheme && window.__activeTheme.icons) || {}; document.getElementById('ov-panda').textContent = stars === 3 ? '⚡' : (_thi.player || '🤖');
      document.getElementById('ov-title').textContent = isLast ? 'ALL Missions Complete! 🤖⚡' : 'Level ' + lvl.id + ' complete!';
      document.getElementById('ov-stars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
      document.getElementById('ov-sub').textContent = msgs[stars];
      document.getElementById('ov-moves').textContent = state.moves;
      const pd = getPlayerData(currentPlayer);
      const best = pd.levelBest[lvl.id];
      document.getElementById('ov-best').textContent = best ? best.moves + 'm · ' + best.time + 's' : '—';
      const rec = document.getElementById('ov-newrecord');
      rec.style.display = isNewBest ? 'block' : 'none';
      rec.textContent = prev ? '🎉 New Personal Best!' : '🌟 First clear!';
      const nextBtn = document.getElementById('ov-btn-next');
      if (isLast) {
        nextBtn.textContent = '🏠 Back to Launcher';
        nextBtn.onclick = () => { closeOverlays(); goToLauncher(); };
      } else {
        nextBtn.textContent = 'Next Level →';
        nextBtn.onclick = () => { closeOverlays(); goNextLevel(); };
      }
      document.getElementById('overlay-levelcomplete').classList.add('active');
      confetti();
    }

    function goNextLevel() {
      const n = state.currentLevel.id + 1;
      if (n <= LEVELS.length) startLevel(n);
      else showScreen('screen-levels');
    }
    function replayLevel() { startLevel(state.currentLevel.id); }

    function confirmQuitToLevels() {
      if (confirm('Back to level select? Current level progress will be lost.')) {
        clearInterval(state.timerInterval);
        closeOverlays();
        showScreen('screen-levels');
      }
    }

    // ═══════════════════════════════ OVERLAYS ═══════════════════════════════
    function closeOverlays() {
      document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
    }

    function openConfirm(title, text, cb) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-text').textContent = text;
      document.getElementById('overlay-confirm').classList.add('active');
      document.getElementById('confirm-yes-btn').onclick = () => { closeOverlays(); cb(); };
    }

    // ═══════════════════════════════ TOAST ═══════════════════════════════
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    // ═══════════════════════════════ CONFETTI ═══════════════════════════════
    function confetti() {
      const cols = ['#3b82f6','#f5c842','#ef4444','#8ecae6','#a78bfa','#f97316','#22d3ee'];
      for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = cols[Math.floor(Math.random() * cols.length)];
        el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        el.style.animationDelay = (Math.random() * 0.8) + 's';
        el.style.width = (8 + Math.random() * 10) + 'px';
        el.style.height = (8 + Math.random() * 10) + 'px';
        el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
    }

    // ═══════════════════════════════ LAUNCHER SHELL ═══════════════════════════════
    const _lp = new URLSearchParams(window.location.search);
    const launcherPlayer = _lp.get('player');
    const launcherDay    = _lp.get('day');
    const birthdayMsg    = _lp.get('birthdayMsg');
    const giftClue       = _lp.get('giftClue');
    const clueEmoji      = _lp.get('clueEmoji') || '🎁';
    const gameName       = _lp.get('gameName') || document.title;

    function goToLauncher() { window.top.location.href = '../launcher/index.html'; }

    function initShell() {
      const playerName = launcherPlayer || currentPlayer || 'Player';
      document.getElementById('lb-av').textContent = playerName[0].toUpperCase();
      document.getElementById('lb-name').textContent = playerName;
    }

    function updateShell(screenId) {
      // reserved for future shell updates
    }

    function writeLauncherProgress(starsEarned) {
      if (!launcherPlayer || !launcherDay) return;
      try {
        const key = 'pandabday_launcher';
        const store = JSON.parse(localStorage.getItem(key) || '{"players":[]}');
        let player = store.players.find(p => p.name === launcherPlayer);
        if (!player) { player = { name: launcherPlayer, daysPlayed: {}, stars: {} }; store.players.push(player); }
        if (!player.daysPlayed) player.daysPlayed = {};
        if (!player.stars) player.stars = {};
        player.daysPlayed[launcherDay] = true;
        player.stars[launcherDay] = starsEarned;
        localStorage.setItem(key, JSON.stringify(store));
      } catch(e) {}
    }

    function showBirthdayCelebration(starsEarned, onDone) {
      if (!birthdayMsg && !giftClue) { onDone(); return; }
      const ov = document.getElementById('overlay-birthday');
      document.getElementById('bday-emoji').textContent = clueEmoji;
      document.getElementById('bday-msg').textContent = birthdayMsg || 'Amazing job!!';
      document.getElementById('bday-clue-text').textContent = giftClue || '';
      document.getElementById('bday-clue-box').style.display = giftClue ? 'block' : 'none';
      ov.classList.add('active');
      document.getElementById('bday-done-btn').onclick = () => { ov.classList.remove('active'); onDone(); };
    }

    // ═══════════════════════════════ INIT ═══════════════════════════════
    if (launcherPlayer) {
      if (!allData[launcherPlayer]) {
        allData[launcherPlayer] = { unlockedLevels: [1], levelStars: {}, levelBest: {} };
        saveAllData(allData);
      }
      currentPlayer = launcherPlayer;
    }
    // Fall back to first known player if no launcher param
    if (!currentPlayer && Object.keys(allData).length > 0) {
      currentPlayer = Object.keys(allData)[0];
    }
    initShell();
    showScreen('screen-levels');
  </script>



  <script>
  /* ── THEME SYNC: runs after DOM is ready ─────────────────────────────────── */
  (function() {
    var t   = window.__T  || window.__activeTheme || {};
    var TI  = window.__TI || t.icons   || {};
    var TS  = window.__TS || t.strings || {};
    var Th  = window.PandaAdventure && window.PandaAdventure.Theme;
    var mascot = t.mascot || '🎮';

    /* game name badge + page title */
    var params = new URLSearchParams(window.location.search);
    var dayId  = params.get('dayId');
    if (!dayId && window.APP_CONFIG && window.APP_CONFIG.days) {
      var path = window.location.pathname;
      for (var i=0; i<window.APP_CONFIG.days.length; i++) {
        if (path.indexOf(window.APP_CONFIG.days[i].file.replace('../games/','')) !== -1) {
          dayId = window.APP_CONFIG.days[i].id; break;
        }
      }
    }
    const gameTitle = (dayId && Th) ? Th.getGameTitle(t, dayId, document.title) : (t.name || document.title);
    document.title = gameTitle;
    const tag = document.getElementById('level-game-tag') || document.querySelector('.game-name-tag');
    if (tag) tag.textContent = gameTitle;

    /* mascot / win overlay */
    ['ov-panda','win-panda','ov-emoji','level-mascot'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.textContent = mascot;
    });

    window.writeLauncherProgress = function(starsEarned) {
      if (!launcherPlayer || !launcherDay) return;
      try {
        const key = 'birthday_adventure_players_v1';
        const players = JSON.parse(localStorage.getItem(key) || '[]');
        let player = players.find(p => p.name === launcherPlayer);
        if (!player) {
          player = { name: launcherPlayer, stars: 0, streak: 0 };
          players.push(player);
        }
        localStorage.setItem(key, JSON.stringify(players));
      } catch (e) { }
    };

    /* retry / next / results buttons via data-btn attribute */
    document.querySelectorAll('[data-btn="retry"]').forEach(function(el){
      el.textContent = TS.retryBtn || 'Retry! 🔄';
    });
    document.querySelectorAll('[data-btn="next"]').forEach(function(el){
      el.textContent = TS.winBtn || 'Next →';
    });
    document.querySelectorAll('[data-btn="results"]').forEach(function(el){
      el.textContent = TS.resultsBtn || 'See results';
    });

    /* clue-box: style with theme accent colors */
    var clueBox = document.getElementById('bday-clue-box');
    if (clueBox) {
      clueBox.style.background = 'var(--surface-2)';
      clueBox.style.borderColor = 'var(--accent-2)';
    }
    var bdayMsg = document.getElementById('bday-msg');
    if (bdayMsg) bdayMsg.style.color = 'var(--muted)';

    /* completion prefix from theme strings */
    var winPrefix = document.getElementById('win-prefix');
    if (winPrefix) winPrefix.textContent = TS.completionPrefix || '';
  })();
  </script>
